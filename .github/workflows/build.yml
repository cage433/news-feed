name: Build and publish news feed

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort and can run late
    # under load, so treat this as "roughly half-hourly", not to the second.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
  push:
    branches: [main]        # rebuild when you edit feeds.txt or the template

permissions:
  contents: read
  pages: write
  id-token: write

# If a scheduled run overlaps a manual one, let the newer finish rather than
# queueing both. Don't cancel a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Some feeds (Weekly Worker) publish no per-entry dates. state.json
      # remembers when each undated link was first seen so those stories age
      # normally instead of jumping to the top on every run. The unique key
      # plus restore-keys prefix means each run saves a fresh copy and
      # restores the most recent one. Losing the cache is harmless.
      - name: Restore first-seen dates
        uses: actions/cache@v4
        with:
          path: state.json
          key: news-feed-state-${{ github.run_id }}
          restore-keys: news-feed-state-

      - name: Build page
        run: python build.py

      # The page's JavaScript is embedded in a Python f-string, where a stray
      # brace breaks it silently. This runs the real shipped script against a
      # DOM stub, so a broken filter fails the build instead of the page.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test filters
        run: deno run --allow-read=. test_filters.js

      - name: Test read-state expiry
        run: deno run --allow-read=. test_read_expiry.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
