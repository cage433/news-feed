name: Tests

# The page is NOT built or deployed here. Six sources — Electronic Intifada
# and five *.substack.com feeds — return HTTP 403 to GitHub's datacenter IP
# ranges, so a build here would be missing about a quarter of the stories.
# publish.sh builds on Alex's Mac and pushes the result to the `published`
# branch, which GitHub Pages serves directly.
#
# What's left here is a safety net: the page's JavaScript is embedded in a
# Python f-string, where a stray brace breaks it silently. This builds a page
# from whatever feeds it can reach and runs the real script against a DOM
# stub, so a broken filter shows up on push rather than on the live site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Partial by design: the blocked sources are simply absent, which is
      # fine, since the tests only need a page to exercise, not a complete one.
      - name: Build a page to test against
        run: python build.py

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test filters
        run: deno run --allow-read=. test_filters.js

      - name: Test read-state expiry
        run: deno run --allow-read=. test_read_expiry.js
